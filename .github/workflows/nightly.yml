# Publishes the rolling "nightly" pre-release from master. Runs when a pull
# request is merged. The daily schedule rebuilds only if master has changed
# since the last nightly, but always checks that the pinned SDRplay installer
# still downloads with the pinned checksum, so a withdrawn or silently replaced
# installer shows up as a failed run rather than at the next release.
name: Nightly

on:
  push:
    branches: [master]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the pinned SDRplay installer
        run: ./native/fetch-headers.sh

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source native/versions.env
          marker="Built from ${GITHUB_SHA}"
          build=true
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             gh release view nightly --json body --jq .body 2>/dev/null | grep -qF "$marker"; then
            build=false
          fi
          {
            echo "build=$build"
            echo "version=${SDRPLAY_API_VERSION}-nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly jars/* --prerelease --latest=false \
            --target "$GITHUB_SHA" \
            --title "Nightly $VERSION" \
            --notes "Automated build of master. Not for production use.

          Requires the SDRplay API, which is not included: install it from https://www.sdrplay.com/api/

          Built from ${GITHUB_SHA}"
