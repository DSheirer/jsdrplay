# Checks the bindings against the SDRplay API headers on all six platforms,
# assembles the jar, and checks that the jar runs on each platform.
# Called by the ci, nightly and release workflows.
#
# There is no native build: the SDRplay API is closed source and may not be
# redistributed, so the jar contains only Java code and loads the API that the
# user installs. What each platform job checks instead is that its C compiler
# lays out every API structure exactly as Layouts.java does.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version of the jar
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: '23'

jobs:
  bindings:
    name: Bindings ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2022, msvc_arch: x64 }
          - { platform: windows-aarch64, runner: windows-11-arm, msvc_arch: ARM64 }
    steps:
      - uses: actions/checkout@v7

      # Downloads the pinned installer, extracts only its headers, checks the
      # function list, and records the struct layouts this compiler produces.
      - name: Probe the SDRplay API headers
        shell: bash
        run: ./native/probe-layouts.sh ${{ matrix.msvc_arch }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      # requireLayoutProbe makes a missing probe result a failure, not a skip.
      - name: Test bindings on this platform
        shell: bash
        run: ./gradlew test --console=plain -PrequireLayoutProbe=true

      - uses: actions/upload-artifact@v7
        with:
          name: layout-${{ matrix.platform }}
          path: build/sdrplay-api/layout.properties
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble jar
    needs: bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble
        env:
          VERSION: ${{ inputs.version }}
        run: ./gradlew assemble --console=plain -Pversion="$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify jar ${{ matrix.platform }}
    needs: package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2022 }
          - { platform: windows-aarch64, runner: windows-11-arm }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The runners have no SDRplay API, so this checks that the jar starts,
      # maps the platform and searches for the library without crashing.
      - name: Run the jar
        shell: bash
        run: |
          jar="$(ls jsdrplay-*.jar | grep -Ev -- '-(sources|javadoc)\.jar$')"
          java -jar "$jar" | tee output.txt
          grep -q '^SDRplay API library: ' output.txt
